name: Validate Battle Factory Companion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Factory data and percentage-only analysis
        run: node scripts/validateFactory.mjs

      - name: Check Expo project
        run: npx expo-doctor

      - name: Bundle iOS JavaScript
        run: npx expo export --platform ios

