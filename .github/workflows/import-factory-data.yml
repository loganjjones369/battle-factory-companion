name: Import Emerald Factory dataset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download canonical Factory set data
        run: |
          curl -L --fail --retry 3 -o /tmp/allpkmn.csv https://raw.githubusercontent.com/DaveGlorbus/BattleFactoryBuddy/main/BattleFactoryBuddy/InputData/allpkmn.csv
          curl -L --fail --retry 3 -o /tmp/pokemon.csv https://raw.githubusercontent.com/veekun/pokedex/master/pokedex/data/csv/pokemon.csv
          curl -L --fail --retry 3 -o /tmp/pokemon_stats.csv https://raw.githubusercontent.com/veekun/pokedex/master/pokedex/data/csv/pokemon_stats.csv

      - name: Build local JavaScript dataset
        run: |
          python3 - <<'PY'
          import csv, json, re
          from collections import defaultdict
          from pathlib import Path

          def norm(s):
              return re.sub(r'[^a-z0-9]', '', str(s).lower())

          # Gen III default Pokémon and their base stats from veekun.
          names = {}
          with open('/tmp/pokemon.csv', newline='', encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  if row['is_default'] != '1' or int(row['id']) > 386:
                      continue
                  names[norm(row['identifier'])] = (int(row['id']), row['identifier'])

          stats = defaultdict(dict)
          with open('/tmp/pokemon_stats.csv', newline='', encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  pid = int(row['pokemon_id'])
                  if pid <= 386:
                      stats[pid][int(row['stat_id'])] = int(row['base_stat'])

          def find_species_id(display):
              key = norm(display)
              if key in names:
                  return names[key][0]
              aliases = {
                  'mrmime': 'mr-mime', 'farfetchd': 'farfetchd', 'nidoranf': 'nidoran-f',
                  'nidoranm': 'nidoran-m', 'hooh': 'ho-oh', 'porygon2': 'porygon2'
              }
              alias = aliases.get(key)
              if alias and norm(alias) in names:
                  return names[norm(alias)][0]
              for nk, (pid, _) in names.items():
                  if nk == key or nk.replace('-', '') == key.replace('-', ''):
                      return pid
              raise SystemExit(f'Could not map Factory species to Gen III dex data: {display}')

          sets_by_species = defaultdict(list)
          with open('/tmp/allpkmn.csv', encoding='utf-8') as f:
              for line in f:
                  fields = [x.strip() for x in line.strip().split(',')]
                  if len(fields) < 15:
                      continue
                  type_text, style_text, species, set_no, nature, item, m1, m2, m3, m4, round_marker, ability, ev_text, base_speed, source_id = fields[:15]
                  pid = find_species_id(species)
                  ev_parts = [int(x.strip() or 0) for x in ev_text.split('/')]
                  ev_parts += [0] * (6 - len(ev_parts))
                  base = stats[pid]
                  if len(base) != 6:
                      raise SystemExit(f'Missing base stats for {species} ({pid})')
                  set_obj = {
                      'id': int(set_no),
                      'item': item,
                      'nature': nature,
                      'ability': ability,
                      'evs': dict(zip(['hp','atk','def','spa','spd','spe'], ev_parts[:6])),
                      'moves': [m1,m2,m3,m4],
                      'style': style_text.split(),
                      'round': int(round_marker),
                      'baseSpeed': int(base_speed),
                      'sourceId': int(source_id),
                  }
                  sets_by_species[species].append(set_obj)

          pokemon = {}
          for species, sets in sets_by_species.items():
              pid = find_species_id(species)
              base = stats[pid]
              types = []
              # The canonical CSV's type field is authoritative for Factory data.
              # It is attached below from the first row's temporary field.
              with open('/tmp/allpkmn.csv', encoding='utf-8') as f:
                  for line in f:
                      fields = [x.strip() for x in line.strip().split(',')]
                      if len(fields) >= 15 and fields[2].strip() == species:
                          types = fields[0].split()
                          break
              pokemon[species] = {
                  'id': pid,
                  'types': types,
                  'baseStats': dict(zip(['hp','atk','def','spa','spd','spe'], [base[1],base[2],base[3],base[4],base[5],base[6]])),
                  'sets': sets,
              }

          js = '''// Generated from BattleFactoryBuddy's canonical allpkmn.csv.\n// Do not edit manually; the import workflow regenerates this file.\n\nexport const DATASET_META = { source: 'BattleFactoryBuddy/allpkmn.csv', generated: '%s', speciesCount: %d, setCount: %d };\nexport const FACTORY_RULES = {\n  rentalIVsByRound: { 1: 3, 2: 6, 3: 9, 4: 12, 5: 15, 6: 21, 7: 31 },\n};\n\nexport const POKEMON = %s;\n\nexport function normalizePokemonName(value) {\n  const cleaned = String(value || '').trim().toLowerCase();\n  return Object.keys(POKEMON).find((name) => name.toLowerCase() === cleaned) || null;\n}\nexport function getPokemon(value) {\n  const name = normalizePokemonName(value);\n  return name ? { name, ...POKEMON[name] } : null;\n}\nexport function getSets(value) { return getPokemon(value)?.sets || []; }\n''' % ('github-actions', len(pokemon), sum(len(v) for v in pokemon.values()), json.dumps(pokemon, ensure_ascii=False, separators=(',', ':')))
          Path('data/factoryData.js').write_text(js, encoding='utf-8')
          PY

      - name: Commit imported dataset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/factoryData.js
          git diff --cached --quiet && exit 0
          git commit -m "Import complete Emerald Battle Factory dataset"
          git push
