name: Import Emerald Factory dataset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download canonical Factory set data
        run: |
          curl -L --fail --retry 3 -o /tmp/allpkmn.csv 'https://raw.githubusercontent.com/DaveGlorbus/BattleFactoryBuddy/main/BattleFactoryBuddy/InputData/allpkmn.csv'
          curl -L --fail --retry 3 -o /tmp/group1.html 'https://bulbapedia.bulbagarden.net/wiki/Battle_Frontier_(Generation_III)/Pok%C3%A9mon_(Group_1)'
          curl -L --fail --retry 3 -o /tmp/group2.html 'https://bulbapedia.bulbagarden.net/wiki/Battle_Frontier_(Generation_III)/Pok%C3%A9mon_(Group_2)'
          curl -L --fail --retry 3 -o /tmp/pokemon.csv 'https://raw.githubusercontent.com/veekun/pokedex/master/pokedex/data/csv/pokemon.csv'
          curl -L --fail --retry 3 -o /tmp/pokemon_stats.csv 'https://raw.githubusercontent.com/veekun/pokedex/master/pokedex/data/csv/pokemon_stats.csv'
          curl -L --fail --retry 3 -o /tmp/pokemon_types.csv 'https://raw.githubusercontent.com/veekun/pokedex/master/pokedex/data/csv/pokemon_types.csv'
          curl -L --fail --retry 3 -o /tmp/pokemon_abilities.csv 'https://raw.githubusercontent.com/veekun/pokedex/master/pokedex/data/csv/pokemon_abilities.csv'
          curl -L --fail --retry 3 -o /tmp/abilities.csv 'https://raw.githubusercontent.com/veekun/pokedex/master/pokedex/data/csv/abilities.csv'
          python3 -m pip install --disable-pip-version-check --quiet pandas lxml beautifulsoup4

      - name: Build local JavaScript dataset
        run: |
          python3 - <<'PY'
          import csv, json, re
          from collections import defaultdict
          from pathlib import Path
          from bs4 import BeautifulSoup

          def norm(s): return re.sub(r'[^a-z0-9]', '', str(s).lower())

          names = {}
          with open('/tmp/pokemon.csv', newline='', encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  if row['is_default'] == '1' and int(row['id']) <= 386: names[norm(row['identifier'])] = int(row['id'])
          stats = defaultdict(dict)
          with open('/tmp/pokemon_stats.csv', newline='', encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  pid = int(row['pokemon_id'])
                  if pid <= 386: stats[pid][int(row['stat_id'])] = int(row['base_stat'])
          types = defaultdict(list)
          with open('/tmp/pokemon_types.csv', newline='', encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  pid = int(row['pokemon_id'])
                  if pid <= 386: types[pid].append((int(row['slot']), row['type']))
          for pid in types: types[pid] = [x.replace('-', ' ').title() for _, x in sorted(types[pid])]
          ability_names = {}
          with open('/tmp/abilities.csv', newline='', encoding='utf-8') as f:
              for row in csv.DictReader(f): ability_names[int(row['id'])] = row['identifier'].replace('-', ' ').title()
          abilities_by_pid = defaultdict(list)
          with open('/tmp/pokemon_abilities.csv', newline='', encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  pid = int(row['pokemon_id'])
                  if pid <= 386 and row.get('is_hidden', '0') == '0': abilities_by_pid[pid].append((int(row['slot']), ability_names.get(int(row['ability_id']), '')))
          for pid in abilities_by_pid: abilities_by_pid[pid] = [x for _, x in sorted(abilities_by_pid[pid]) if x]
          aliases = {'mrmime':'mr-mime','nidoranf':'nidoran-f','nidoranm':'nidoran-m','hooh':'ho-oh'}
          def find_species_id(display):
              key = norm(display)
              if key in names: return names[key]
              alias = aliases.get(key)
              if alias and norm(alias) in names: return names[norm(alias)]
              raise SystemExit(f'Could not map Factory species to Gen III dex data: {display}')
          def species_abilities(species): return ' / '.join(abilities_by_pid.get(find_species_id(species), []))
          sets_by_species = defaultdict(list)

          with open('/tmp/allpkmn.csv', encoding='utf-8') as f:
              for line in f:
                  fields = [x.strip() for x in line.strip().split(',')]
                  if len(fields) < 15: continue
                  type_text, style_text, species, set_no, nature, item, m1, m2, m3, m4, round_marker, ability, ev_text, base_speed, source_id = fields[:15]
                  ev_parts = [int(x.strip() or 0) for x in ev_text.split('/')]; ev_parts += [0] * (6 - len(ev_parts))
                  try: set_no = int(set_no)
                  except ValueError: pass
                  try: round_marker = int(round_marker)
                  except ValueError: pass
                  try: source_id = int(source_id)
                  except ValueError: pass
                  sets_by_species[species].append({'id': set_no, 'species': species, 'item': item, 'nature': nature, 'ability': ability, 'evs': dict(zip(['hp','atk','def','spa','spd','spe'], ev_parts[:6])), 'moves': [m1,m2,m3,m4], 'style': style_text.split(), 'round': round_marker, 'pool': f'g3-{round_marker}', 'baseSpeed': int(base_speed), 'sourceId': source_id, 'styleDataComplete': True})

          def extract_group(html_path, group_number):
              soup = BeautifulSoup(Path(html_path).read_text(encoding='utf-8'), 'lxml')
              heading = next((h for h in soup.find_all('h2') if h.get_text(' ', strip=True).lower().startswith(f'group {group_number}')), None)
              if heading is None: raise SystemExit(f'Could not find Group {group_number} heading')
              table = heading.find_next('table')
              if table is None: raise SystemExit(f'Could not find Group {group_number} table')
              rows = []
              for tr in table.find_all('tr'):
                  cells = [c.get_text(' ', strip=True) for c in tr.find_all(['th','td'])]
                  if len(cells) >= 10 and cells[0].isdigit(): rows.append(cells)
              grouped = defaultdict(list)
              for row in rows:
                  species = re.sub(r'[^A-Za-z .\'-]', '', row[1]).strip()
                  grouped[species].append((row[2], row[3:7], row[7], [0 if x == '-' else int(x) for x in row[8:14]]))
              source_counter = 100000 if group_number == 1 else 200000
              for species, variants in grouped.items():
                  for index, (item, moves, nature, evs) in enumerate(variants, 1):
                      if group_number == 1: pool, round_value, set_no = 'l50-1', 'L1', 1
                      else: pool, round_value, set_no = ('l50-2', 'L2', 1) if index == 1 else ('l50-3', 'L3', index)
                      pid = find_species_id(species)
                      sets_by_species[species].append({'id': set_no, 'species': species, 'item': item, 'nature': nature, 'ability': species_abilities(species), 'evs': dict(zip(['hp','atk','def','spa','spd','spe'], evs)), 'moves': moves, 'style': [], 'round': round_value, 'pool': pool, 'baseSpeed': int(stats[pid][6]), 'sourceId': source_counter, 'styleDataComplete': False})
                      source_counter += 1
          extract_group('/tmp/group1.html', 1)
          extract_group('/tmp/group2.html', 2)

          pokemon = {}
          for species, sets in sets_by_species.items():
              pid = find_species_id(species); base = stats[pid]
              pokemon[species] = {'id': pid, 'types': types.get(pid, []), 'baseStats': dict(zip(['hp','atk','def','spa','spd','spe'], [base[1],base[2],base[3],base[4],base[5],base[6]])), 'sets': sets}
          total_sets = sum(len(v) for v in pokemon.values()); group3_sets = sum(1 for v in pokemon.values() for s in v['sets'] if str(s.get('pool','')).startswith('g3-')); early_sets = total_sets - group3_sets
          js = '''// Generated from BattleFactoryBuddy's canonical Group 3 data plus Bulbapedia's Group 1/2 tables.\n// Do not edit manually; the import workflow regenerates this file.\n\nexport const DATASET_META = { source: 'BattleFactoryBuddy/allpkmn.csv + Bulbapedia Gen III Group 1/2', generated: 'github-actions', speciesCount: %d, setCount: %d, group3SetCount: %d, earlyLevel50SetCount: %d, earlyStyleDataComplete: false };\nexport const FACTORY_RULES = { rentalIVsByRound: { 1: 3, 2: 6, 3: 9, 4: 12, 5: 15, 6: 21, 7: 31 } };\nexport const POKEMON = %s;\nexport function normalizePokemonName(value) { const cleaned = String(value || '').trim().toLowerCase(); return Object.keys(POKEMON).find((name) => name.toLowerCase() === cleaned) || null; }\nexport function getPokemon(value) { const name = normalizePokemonName(value); return name ? { name, ...POKEMON[name] } : null; }\nexport function getSets(value) { return getPokemon(value)?.sets || []; }\n''' % (len(pokemon), total_sets, group3_sets, early_sets, json.dumps(pokemon, ensure_ascii=False, separators=(',', ':')))
          Path('data/factoryData.js').write_text(js, encoding='utf-8')
          PY

      - name: Commit imported dataset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/factoryData.js
          git diff --cached --quiet && exit 0
          git commit -m "Import Level 50 early Factory pools"
          git push
