name: Import Emerald Factory dataset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download canonical Factory set data
        run: |
          curl -L --fail --retry 3 -o /tmp/allpkmn.csv 'https://raw.githubusercontent.com/DaveGlorbus/BattleFactoryBuddy/main/BattleFactoryBuddy/InputData/allpkmn.csv'
          curl -L --fail --retry 3 -o /tmp/pokemon.csv 'https://raw.githubusercontent.com/veekun/pokedex/master/pokedex/data/csv/pokemon.csv'
          curl -L --fail --retry 3 -o /tmp/pokemon_stats.csv 'https://raw.githubusercontent.com/veekun/pokedex/master/pokedex/data/csv/pokemon_stats.csv'

      - name: Build local JavaScript dataset
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          names = {}
          with open('/tmp/pokemon.csv', newline='', encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  if row['is_default'] == '1' and int(row['id']) <= 386:
                      names[row['identifier'].lower()] = int(row['id'])

          stats = {}
          with open('/tmp/pokemon_stats.csv', newline='', encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  pid = int(row['pokemon_id'])
                  if pid <= 386:
                      stats.setdefault(pid, {})[int(row['stat_id'])] = int(row['base_stat'])

          def find_species_id(name):
              key = name.strip().lower().replace('♀', '-f').replace('♂', '-m').replace(' ', '-')
              aliases = {'mr.-mime':'mr-mime','farfetch’d':'farfetchd','farfetch’d':'farfetchd','nidoran♀':'nidoran-f','nidoran♂':'nidoran-m'}
              key = aliases.get(key, key)
              if key in names: return names[key]
              key = key.replace('é', 'e')
              if key in names: return names[key]
              raise SystemExit(f'Unknown species in canonical Factory dataset: {name}')

          pokemon = {}
          with open('/tmp/allpkmn.csv', encoding='utf-8') as f:
              for line in f:
                  fields = [x.strip() for x in line.strip().split(',')]
                  if len(fields) < 15: continue
                  type_text, style_text, species, set_no, nature, item, m1, m2, m3, m4, round_marker, ability, ev_text, base_speed, source_id = fields[:15]
                  pid = find_species_id(species)
                  ev_parts = [int(x.strip() or 0) for x in ev_text.split('/')]
                  ev_parts += [0] * (6 - len(ev_parts))
                  try: set_no = int(set_no)
                  except ValueError: pass
                  try: round_marker = int(round_marker)
                  except ValueError: pass
                  try: source_id = int(source_id)
                  except ValueError: pass
                  if species not in pokemon:
                      base = stats[pid]
                      pokemon[species] = {
                          'id': pid,
                          'types': type_text.split(),
                          'baseStats': dict(zip(['hp','atk','def','spa','spd','spe'], [base[1],base[2],base[3],base[4],base[5],base[6]])),
                          'sets': [],
                      }
                  pokemon[species]['sets'].append({
                      'id': set_no, 'species': species, 'item': item, 'nature': nature, 'ability': ability,
                      'evs': dict(zip(['hp','atk','def','spa','spd','spe'], ev_parts[:6])), 'moves': [m1,m2,m3,m4],
                      'style': style_text.split(), 'round': round_marker, 'pool': f'g3-{round_marker}', 'baseSpeed': int(base_speed),
                      'sourceId': source_id, 'styleDataComplete': True,
                  })

          js = '''// Generated from BattleFactoryBuddy's canonical Emerald Factory set dataset.\n// Do not edit manually; the import workflow regenerates this file.\n\nexport const DATASET_META = { source: 'BattleFactoryBuddy/allpkmn.csv', generated: 'github-actions', speciesCount: %d, setCount: %d, group3SetCount: %d, earlyLevel50SetCount: 0, earlyStyleDataComplete: false };\nexport const FACTORY_RULES = { rentalIVsByRound: { 1: 3, 2: 6, 3: 9, 4: 12, 5: 15, 6: 21, 7: 31 } };\nexport const POKEMON = %s;\nexport function normalizePokemonName(value) { const cleaned = String(value || '').trim().toLowerCase(); return Object.keys(POKEMON).find((name) => name.toLowerCase() === cleaned) || null; }\nexport function getPokemon(value) { const name = normalizePokemonName(value); return name ? { name, ...POKEMON[name] } : null; }\nexport function getSets(value) { return getPokemon(value)?.sets || []; }\n''' % (len(pokemon), sum(len(x['sets']) for x in pokemon.values()), sum(len(x['sets']) for x in pokemon.values()), json.dumps(pokemon, ensure_ascii=False, separators=(',', ':')))
          Path('data/factoryData.js').write_text(js, encoding='utf-8')
          PY

      - name: Commit imported dataset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/factoryData.js
          git diff --cached --quiet && exit 0
          git commit -m "Import canonical Emerald Factory dataset"
          git push
