name: Repair Candidate Analysis Panel

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair CandidateAnalysisPanel
        shell: python
        run: |
          from pathlib import Path
          p = Path('components/CandidateAnalysisPanel.js')
          lines = p.read_text().splitlines()
          lines[12] = "function knownSet(p) { return p?.species && (p?.setId != null || p?.sourceId != null || p?.id != null) ? p : null; }"
          lines[155] = "            {open && <View style={styles.detailCard}>{!!matches.length && <><Text style={styles.reasonTitle}>WHY THIS SET SURVIVED</Text><Text style={styles.reasonText}>{matches.join(' • ')}</Text></>}{!!threat && <Text style={styles.detail}>{threatLabel(threat)}</Text>}{!!set.item && <Text style={styles.detail}>Item: {set.item}</Text>}{!!set.nature && <Text style={styles.detail}>Nature: {set.nature}</Text>}{!!set.ability && <Text style={styles.detail}>Ability: {set.ability}</Text>}{!!moveNames(set).length && <Text style={styles.detail}>Moves: {moveNames(set).join(' • ')}</Text>}</View>}"
          p.write_text('\n'.join(lines) + '\n')

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/CandidateAnalysisPanel.js
          git commit -m 'Fix CandidateAnalysisPanel JSX syntax' || exit 0
          git push

      - name: Remove one-time repair workflow
        run: |
          git rm .github/workflows/fix-candidate-panel.yml || true
          git commit -m 'Remove one-time candidate panel repair workflow' || exit 0
          git push
