name: Patch draft spread swap context

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Pass swap count into draft intelligence
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('RunFlowV3.js')
          text = p.read_text()
          old = '<DraftDecisionLab draft={draft} blockedSpecies={draft.filter(Boolean).map(p=>p.species)} levelMode={level} battle={b} />'
          new = '<DraftDecisionLab draft={draft} blockedSpecies={draft.filter(Boolean).map(p=>p.species)} levelMode={level} battle={b} swaps={sw} />'
          if old not in text:
              raise SystemExit('Expected DraftDecisionLab call was not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RunFlowV3.js
          git diff --cached --quiet && exit 0
          git commit -m 'Pass swap count into draft set spread'
          git push
      - name: Remove patch workflow
        if: always()
        run: |
          rm -f .github/workflows/patch-draft-spread-prop.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/patch-draft-spread-prop.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Remove one-time draft spread patch workflow'
          git push
