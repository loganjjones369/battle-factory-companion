name: Integrate opponent draft screen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Integrate component
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/DraftDecisionLab.js')
          s = p.read_text()
          if "import OpponentDraftLab from './OpponentDraftLab';" not in s:
              s = s.replace("import TeamCombinationLab from './TeamCombinationLab';", "import TeamCombinationLab from './TeamCombinationLab';\nimport OpponentDraftLab from './OpponentDraftLab';")
          old = "<TeamCombinationLab draft={usable} levelMode={levelMode} battle={battle} swaps={swaps} />"
          new = old + "\n    <OpponentDraftLab draft={usable} scientist={scientist} levelMode={levelMode} battle={battle} blockedSpecies={blockedSpecies} revealed={revealed} noland={noland} />"
          if "<OpponentDraftLab " not in s:
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/DraftDecisionLab.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Integrate opponent draft screen"
            git push
          fi

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/integrate-opponent-screen.yml
          git commit -m "Remove temporary opponent integration workflow"
          git push
