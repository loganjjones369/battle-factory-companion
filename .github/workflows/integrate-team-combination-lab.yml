name: Integrate Team Combination Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Integrate component
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/DraftDecisionLab.js')
          text = path.read_text()
          import_line = "import TeamCombinationLab from './TeamCombinationLab';\n"
          if import_line not in text:
              anchor = "import AbilitySelector, { optionsFor } from './AbilitySelector';\n"
              if anchor not in text:
                  raise SystemExit('DraftDecisionLab import anchor not found')
              text = text.replace(anchor, anchor + import_line, 1)
          marker = "    <View style={st.actions}>"
          component = "    <TeamCombinationLab draft={usable} levelMode={levelMode} battle={battle} swaps={swaps} />\n"
          if component not in text:
              if marker not in text:
                  raise SystemExit('DraftDecisionLab actions marker not found')
              text = text.replace(marker, component + marker, 1)
          path.write_text(text)
          PY

      - name: Validate modified file exists
        run: |
          grep -q "TeamCombinationLab" components/DraftDecisionLab.js
          test -f components/TeamCombinationLab.js

      - name: Commit integration and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/DraftDecisionLab.js components/TeamCombinationLab.js .github/workflows/integrate-team-combination-lab.yml
          git commit -m "Integrate team combination draft lab"
          git rm .github/workflows/integrate-team-combination-lab.yml
          git commit -m "Remove temporary integration workflow"
          git push
