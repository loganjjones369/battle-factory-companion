name: Wire Scientist uncertainty UI
on:
  push:
    paths:
      - 'components/CandidateAnalysisPanel.js'
      - 'data/scientistContribution.js'
      - '.github/workflows/wire-scientist-uncertainty.yml'
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire contribution details
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/CandidateAnalysisPanel.js')
          s = p.read_text()
          if "../data/scientistContribution" not in s:
              s = s.replace("import AssistantAnalysis from './AssistantAnalysis';", "import AssistantAnalysis from './AssistantAnalysis';\nimport { explainSetAgainstScientist } from '../data/scientistContribution';")
          marker = "const threat = threatMap[threatKey];"
          replacement = marker + "\n          const scientistInsight = explainSetAgainstScientist(set, scientist, result?.rankedSets?.map((entry) => entry.set) || []);"
          if "const scientistInsight = explainSetAgainstScientist" not in s:
              s = s.replace(marker, replacement)
          old = "{open && <View style={styles.detailCard}>{!!matches.length && <><Text style={styles.reasonTitle}>WHY THIS SET SURVIVED</Text><Text style={styles.reasonText}>{matches.join(' • ')}</Text></>}{!!threat && <Text style={styles.detail}>{threatLabel(threat)}</Text>}{!!set.item && <Text style={styles.detail}>Item: {set.item}</Text>}{!!set.nature && <Text style={styles.detail}>Nature: {set.nature}</Text>}{!!set.ability && <Text style={styles.detail}>Ability: {set.ability}</Text>}{!!moveNames(set).length && <Text style={styles.detail}>Moves: {moveNames(set).join(' • ')}</Text>}</View>}"
          new = "{open && <View style={styles.detailCard}>{!!matches.length && <><Text style={styles.reasonTitle}>WHY THIS SET SURVIVED</Text><Text style={styles.reasonText}>{matches.join(' • ')}</Text></>}{!!scientistInsight?.text && <View style={styles.scientistInsight}><Text style={styles.scientistInsightTitle}>SCIENTIST CONTRIBUTION</Text><Text style={styles.scientistInsightText}>{scientistInsight.text}</Text></View>}{!!threat && <Text style={styles.detail}>{threatLabel(threat)}</Text>}{!!set.item && <Text style={styles.detail}>Item: {set.item}</Text>}{!!set.nature && <Text style={styles.detail}>Nature: {set.nature}</Text>}{!!set.ability && <Text style={styles.detail}>Ability: {set.ability}</Text>}{!!moveNames(set).length && <Text style={styles.detail}>Moves: {moveNames(set).join(' • ')}</Text>}</View>}"
          if old in s and "styles.scientistInsight" not in s:
              s = s.replace(old, new)
          style_marker = "  detailCard:{"
          if "scientistInsight:" not in s:
              idx = s.find(style_marker)
              if idx >= 0:
                  s = s[:idx] + "  scientistInsight:{backgroundColor:'#e2eadf',borderRadius:7,padding:7,marginTop:7,borderWidth:1,borderColor:'#9cac98'},scientistInsightTitle:{fontSize:8.5,fontWeight:'900',letterSpacing:.7,color:'#536453'},scientistInsightText:{fontSize:10,color:'#3f4b42',lineHeight:15,marginTop:3},\n" + s[idx:]
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/CandidateAnalysisPanel.js
          git rm .github/workflows/wire-scientist-uncertainty.yml
          git commit -m 'Show Scientist set contribution in candidate details' || exit 0
          git push
